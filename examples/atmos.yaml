# Replace the example identity and server configuration before use.
plugins:
  packages:
    openbao:
      source: oci://ghcr.io/noeljackson/atmos-openbao-auth
      version: 0.1.1
    secrets:
      source: oci://ghcr.io/cloudposse/atmos/plugins/auth-secrets
      version: 1.1.0
  policy:
    require_signature: true
    trusted_publishers:
    - publisher: noeljackson
      identity: https://github.com/noeljackson/atmos-openbao-auth/.github/workflows/release.yml@refs/tags/v*
      issuer: https://token.actions.githubusercontent.com
    - publisher: cloudposse
      identity: https://github.com/cloudposse/atmos/.github/workflows/plugin-packages.yaml@refs/heads/main
      issuer: https://token.actions.githubusercontent.com
auth:
  keyring:
    type: memory
  providers:
    session:
      kind: noeljackson/oidc-session
      spec:
        issuer: https://login.example.com
        client_id: example-infrastructure-cli
        subject: example-operator
        session_client: ~/.local/libexec/oidc-session-client
        login_method: existing
    browser-login:
      kind: noeljackson/oidc-session
      spec:
        issuer: https://login.example.com
        client_id: example-infrastructure-cli
        subject: example-operator
        session_client: ~/.local/libexec/oidc-session-client
        login_method: browser
    service-credentials:
      kind: secrets/store
      spec:
        credentials:
          api-token:
            store: openbao
            path: services/example/credentials
            field: api_token
  identities:
    openbao-reader:
      kind: noeljackson/openbao
      via:
        provider: session
      spec:
        issuer: https://login.example.com
        client_id: example-infrastructure-cli
        subject: example-operator
        session_client: ~/.local/libexec/oidc-session-client
        address: https://openbao.example.com
        auth_path: jwt
        role: example-reader
        expected_policies:
        - example-reader
        - self-revoke
        self_revoke_policy: self-revoke
        max_ttl_seconds: 120
    service:
      kind: secrets/env
      via:
        provider: service-credentials
      spec:
        env:
          EXAMPLE_API_TOKEN: '{{ index .credentials "api-token" }}'
          VAULT_TOKEN: '{{ "" }}'
          BAO_TOKEN: '{{ "" }}'
stores:
  openbao:
    type: hashicorp-vault
    secret: true
    identity: openbao-reader
    options:
      address: https://openbao.example.com
      mount: kv
      identity_lifetime: operation
